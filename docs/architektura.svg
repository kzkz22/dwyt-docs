<svg xmlns="http://www.w3.org/2000/svg" width="680" height="666" viewBox="0 0 680 666" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>dwyt architektúra</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="666" fill="#FFFFFF"/><rect x="40" y="20" width="600" height="120" rx="18" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="60" y="40" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="central">Központ (publikus) — dwyt-central</text><rect x="50" y="64" width="136" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="118.0" y="80" fill="#3C3489" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Apache</text><text x="118.0" y="99" fill="#534AB7" font-size="12" text-anchor="middle" dominant-baseline="central">TLS, proxy</text><rect x="198" y="64" width="136" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="266.0" y="80" fill="#3C3489" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Webes felület</text><text x="266.0" y="99" fill="#534AB7" font-size="12" text-anchor="middle" dominant-baseline="central">könyvtár, MCP</text><rect x="346" y="64" width="136" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="414.0" y="80" fill="#3C3489" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">PostgreSQL</text><text x="414.0" y="99" fill="#534AB7" font-size="12" text-anchor="middle" dominant-baseline="central">átirat, vektor</text><rect x="494" y="64" width="136" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="562.0" y="80" fill="#3C3489" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">bge-m3</text><text x="562.0" y="99" fill="#534AB7" font-size="12" text-anchor="middle" dominant-baseline="central">keresés, CPU</text><rect x="470" y="160" width="170" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="555.0" y="176" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Felhő, YouTube</text><text x="555.0" y="195" fill="#5F5E5A" font-size="12" text-anchor="middle" dominant-baseline="central">saját kulccsal, saját IP</text><rect x="40" y="230" width="600" height="380" rx="18" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="624" y="252" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="end" dominant-baseline="central">Felhasználó infrastruktúrája</text><rect x="56" y="270" width="170" height="320" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="71" y="292" fill="#3C3489" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="central">1. Futtató</text><text x="71" y="310" fill="#534AB7" font-size="12" text-anchor="start" dominant-baseline="central">dwyt-runner</text><rect x="244" y="270" width="180" height="320" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="259" y="292" fill="#085041" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="central">2. AI-router</text><text x="259" y="310" fill="#0F6E56" font-size="12" text-anchor="start" dominant-baseline="central">dwyt-airouter, mindig megy</text><rect x="442" y="270" width="182" height="320" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="457" y="292" fill="#712B13" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="central">3. GPU-gép</text><text x="457" y="310" fill="#993C1D" font-size="12" text-anchor="start" dominant-baseline="central">dwyt-gpu, igény szerint</text><rect x="71" y="326" width="140" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="141.0" y="342" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Futtató</text><text x="141.0" y="361" fill="#5F5E5A" font-size="12" text-anchor="middle" dominant-baseline="central">yt-dlp, ffmpeg</text><rect x="71" y="386" width="140" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="141.0" y="402" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Kulcsok</text><text x="141.0" y="421" fill="#5F5E5A" font-size="12" text-anchor="middle" dominant-baseline="central">helyben tárolva</text><rect x="71" y="446" width="140" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="141.0" y="462" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Figyelt mappa</text><text x="141.0" y="481" fill="#5F5E5A" font-size="12" text-anchor="middle" dominant-baseline="central">saját felvétel</text><rect x="259" y="326" width="150" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="334.0" y="342" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">LiteLLM</text><text x="334.0" y="361" fill="#5F5E5A" font-size="12" text-anchor="middle" dominant-baseline="central">nevek, tartalék</text><rect x="259" y="386" width="150" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="334.0" y="402" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">llama-swap</text><text x="334.0" y="421" fill="#5F5E5A" font-size="12" text-anchor="middle" dominant-baseline="central">GPU-sor, indítók, WOL</text><rect x="259" y="446" width="150" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="334.0" y="462" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">models.yaml</text><text x="334.0" y="481" fill="#5F5E5A" font-size="12" text-anchor="middle" dominant-baseline="central">egy helyen a modellek</text><rect x="457" y="326" width="152" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="533.0" y="342" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">llama-server</text><text x="533.0" y="361" fill="#5F5E5A" font-size="12" text-anchor="middle" dominant-baseline="central">LLM-modellek</text><rect x="457" y="386" width="152" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="533.0" y="402" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Whisper</text><text x="533.0" y="421" fill="#5F5E5A" font-size="12" text-anchor="middle" dominant-baseline="central">GPU-worker</text><rect x="457" y="446" width="152" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="533.0" y="462" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">NVMe-gyorsítótár</text><text x="533.0" y="481" fill="#5F5E5A" font-size="12" text-anchor="middle" dominant-baseline="central">modellfájlok</text><rect x="457" y="506" width="152" height="48" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="533.0" y="522" fill="#2C2C2A" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">NVIDIA GPU</text><text x="533.0" y="541" fill="#5F5E5A" font-size="12" text-anchor="middle" dominant-baseline="central">VRAM, CUDA</text><path d="M71 350 L48 350 L48 144" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M200 326 L200 184 L466 184" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M211 346 L255 346" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M211 364 L235 364 L235 410 L255 410" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M334 374 L334 384" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M409 400 L433 400 L433 350 L453 350" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M409 416 L453 416" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><text x="40" y="628" fill="#5F5E5A" font-size="12" dominant-baseline="central">Lila: a központ és a futtató (kötelező). Zöld és korall: opcionális csomagok, egy gépre is tehetők.</text><text x="40" y="646" fill="#5F5E5A" font-size="12" dominant-baseline="central">A futtató csak kifelé kapcsolódik a központhoz; a központ soha nem hívja a futtatót.</text></svg>